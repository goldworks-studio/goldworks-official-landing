name: Deploy Next.js site to GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve base path
        shell: bash
        env:
          CUSTOM_PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          if [ -s "public/CNAME" ] || [ -s "CNAME" ]; then
            echo "Detected custom domain via CNAME. Publishing from site root."
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -n "$CUSTOM_PAGES_BASE_PATH" ]; then
            echo "Using custom base path override: $CUSTOM_PAGES_BASE_PATH"
            echo "PAGES_BASE_PATH=$CUSTOM_PAGES_BASE_PATH" >> "$GITHUB_ENV"
            exit 0
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"

          if [[ "$repo_name" == *.github.io ]]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/$repo_name" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build and verify static export
        run: npm run build:pages

      # actions/upload-pages-artifact always drops dot-paths (tar --exclude=".[^/]*"), which would leave out
      # .well-known/discord (Discord's HTTPS domain verification). Pack the export the same way, keeping them.
      - name: Archive Pages artifact
        if: github.event_name != 'pull_request'
        shell: sh
        run: |
          tar --dereference --hard-dereference --directory ./out -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qx './.well-known/discord'

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
